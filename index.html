<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Multimarcas - Robô Pro</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 550px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-top: 20px; margin-bottom: 20px;}
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; font-size: 1.5rem; }
        .section-title { font-size: 0.9rem; color: #94a3b8; margin: 20px 0 10px 0; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #cbd5e1; }
        input, select { width: 100%; padding: 10px 12px; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 0.95rem; }
        input:focus, select:focus { border-color: #38bdf8; outline: none; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        .days-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px; }
        .day-checkbox { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; background: #0f172a; padding: 6px 10px; border-radius: 4px; border: 1px solid #334155; cursor: pointer; }
        .day-checkbox input { width: auto; cursor: pointer; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s; margin-top: 10px; }
        .btn-save { background-color: #10b981; color: white; }
        .btn-save:hover { background-color: #059669; }
        .btn-test { background-color: #3b82f6; color: white; }
        .btn-test:hover { background-color: #2563eb; }
        .btn-logout { background-color: transparent; color: #ef4444; border: 1px solid #ef4444; margin-top: 15px; }
        .btn-logout:hover { background-color: rgba(239, 68, 68, 0.1); }
        #status-msg { text-align: center; margin-top: 15px; font-size: 0.95rem; font-weight: bold; padding: 10px; border-radius: 6px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Painel Multimarcas - Robô Pro</h2>
        
        <div class="section-title">🎯 Seleção da Plataforma</div>
        <div class="form-group">
            <label for="plataforma">Escolha qual canal/plataforma deseja configurar agora:</label>
            <select id="plataforma" onchange="alternarPlataforma()">
                <option value="shopee">Shopee (Canal da Shopee)</option>
                <option value="natura" selected>Natura (Canal da Natura)</option>
                <option value="picpay">PicPay (Canal do PicPay)</option>
            </select>
        </div>

        <!-- 🛑 CONTROLE DE STATUS (LIGA / DESLIGA) -->
        <div class="section-title">⚙️ Controle de Funcionamento</div>
        <div class="form-group">
            <label for="status-robo">Estado do Robô para esta Loja</label>
            <select id="status-robo">
                <option value="ativo" selected>🟢 Ativo (Enviando Ofertas Automaticamente)</option>
                <option value="pausado">⏸️ Pausado (Em Silêncio / Parado)</option>
            </select>
        </div>

        <div class="section-title">🔑 Conexão Telegram & Link</div>
        <div class="form-group">
            <label for="bot-token">Token do Bot do Telegram</label>
            <input type="text" id="bot-token" value="8616829338:AAHHLoPRw5uvx4c01bkRI">
        </div>

        <div class="form-group">
            <label id="label-channel-id" for="channel-id">ID do Canal da Natura</label>
            <input type="text" id="channel-id" value="@cristian_ofertas_natura">
        </div>

        <div class="form-group">
            <label id="label-aff-link" for="aff-link">Seu Link / Vitrine (Consultoria)</label>
            <input type="text" id="aff-link" value="https://www.minhaloja.natura.com/consultoria/ora_et_labora">
        </div>

        <!-- 🏷️ CONFIGURAÇÃO DE CUPOM E DESCONTO -->
        <div class="section-title">🏷️ Cupom & Desconto Promocional</div>
        <div class="row">
            <div class="form-group">
                <label for="cupom-codigo">Cupom Fixo</label>
                <input type="text" id="cupom-codigo" value="CLIENTEVIP">
            </div>
            <div class="form-group">
                <label for="desconto-porc">Desconto Aplicado (%)</label>
                <input type="text" id="desconto-porc" value="10%">
            </div>
        </div>

        <div class="section-title">📅 Dias de Funcionamento Automático</div>
        <div class="form-group">
            <label>Selecione os dias em que o robô deve rodar:</label>
            <div class="days-container">
                <label class="day-checkbox"><input type="checkbox" name="dia" value="Seg" checked> Seg</label>
                <label class="day-checkbox"><input type="checkbox" name="dia" value="Ter" checked> Ter</label>
                <label class="day-checkbox"><input type="checkbox" name="dia" value="Qua" checked> Qua</label>
                <label class="day-checkbox"><input type="checkbox" name="dia" value="Qui" checked> Qui</label>
                <label class="day-checkbox"><input type="checkbox" name="dia" value="Sex" checked> Sex</label>
                <label class="day-checkbox"><input type="checkbox" name="dia" value="Sab" checked> Sáb</label>
                <label class="day-checkbox"><input type="checkbox" name="dia" value="Dom" checked> Dom</label>
            </div>
        </div>

        <div class="section-title">📦 Volume & Frequência da Varredura</div>
        <div class="row">
            <div class="form-group">
                <label for="qtd">Quantidade por Ciclo</label>
                <input type="text" id="qtd" value="5" placeholder="Ex: 5">
            </div>
            <div class="form-group">
                <label for="freq">Base de Frequência</label>
                <select id="freq" onchange="atualizarOpcoesFrequencia()">
                    <option value="Por Minuto" selected>Por Minuto (Intervalo Curto)</option>
                    <option value="Por Hora">Por Hora (Intervalo)</option>
                    <option value="Por Dia">Por Dia (Volume Diário)</option>
                </select>
            </div>
        </div>

        <div class="form-group" id="grupo-detalhe-freq">
            <label id="label-detalhe-freq" for="detalhe-freq">Intervalo (Ex: 1 minuto, 60 minutos)</label>
            <input type="text" id="detalhe-freq" value="60 minutos" placeholder="Ex: 60 minutos">
        </div>

        <div class="section-title">🧹 Limpeza Automática do Canal</div>
        <div class="form-group">
            <label for="cleanup">Apagar mensagens antigas a cada:</label>
            <select id="cleanup">
                <option value="A cada 7 Dias (Semanal)">A cada 7 Dias (Semanal)</option>
                <option value="A cada 15 Dias">A cada 15 Dias</option>
                <option value="A cada 30 Dias (Mensal)">A cada 30 Dias (Mensal)</option>
                <option value="Nunca" selected>Nunca</option>
            </select>
        </div>

        <!-- Botões de Ação -->
        <button class="btn btn-save" onclick="salvarConfiguracoes()">💾 Salvar Configuração Desta Loja</button>
        <button class="btn btn-test" onclick="enviarTesteTelegram()">🚀 Testar Envio no Canal Selecionado</button>
        <button class="btn btn-logout" onclick="sairDaConta()">Sair da Conta</button>

        <div id="status-msg"></div>
    </div>

    <script>
        // Configuração Oficial do Firebase (robo-afiliados-pro)
        const firebaseConfig = {
            apiKey: "AIzaSyB4N7gvqdgIQMxM7Ft5jYMYfno1nox13cw",
            authDomain: "robo-afiliados-pro.firebaseapp.com",
            projectId: "robo-afiliados-pro",
            storageBucket: "robo-afiliados-pro.firebasestorage.app",
            messagingSenderId: "486833496863",
            appId: "1:486833496863:web:ec3001a92ae2c4d934c62a",
            measurementId: "G-5QS5WLX996"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        function alternarPlataforma() {
            const plat = document.getElementById('plataforma').value;
            const inputLink = document.getElementById('aff-link');
            const labelLink = document.getElementById('label-aff-link');
            const inputChannel = document.getElementById('channel-id');
            const labelChannel = document.getElementById('label-channel-id');

            if (plat === 'shopee') {
                labelChannel.innerText = "ID do Canal da Shopee";
                inputChannel.value = "@cristian_ofertas_bot_pro";
                labelLink.innerText = "Seu Link de Afiliado Shopee";
                inputLink.value = "https://s.shopee.com.br/6VOwp1jg5L";
            } else if (plat === 'natura') {
                labelChannel.innerText = "ID do Canal da Natura";
                inputChannel.value = "@cristian_ofertas_natura";
                labelLink.innerText = "Seu Link de Consultoria Natura";
                inputLink.value = "https://www.minhaloja.natura.com/consultoria/ora_et_labora";
            } else if (plat === 'picpay') {
                labelChannel.innerText = "ID do Canal do PicPay";
                inputChannel.value = "@cristian_ofertas_picpay";
                labelLink.innerText = "Seu Link de Convite / Indicação PicPay";
                inputLink.value = "https://picpay.me/seu_usuario";
            }
        }

        function atualizarOpcoesFrequencia() {
            const freq = document.getElementById('freq').value;
            const label = document.getElementById('label-detalhe-freq');
            const input = document.getElementById('detalhe-freq');

            if (freq === 'Por Minuto') {
                label.innerText = "Intervalo em Minutos (Ex: 60 minutos)";
                input.value = "60 minutos";
            } else if (freq === 'Por Hora') {
                label.innerText = "Intervalo em Horas (Ex: 2 horas)";
                input.value = "2 horas";
            } else if (freq === 'Por Dia') {
                label.innerText = "Volume ou Intervalo Diário (Ex: 10 por dia)";
                input.value = "10 por dia";
            }
        }

        function salvarConfiguracoes() {
            const token = document.getElementById('bot-token').value.trim();
            const channel = document.getElementById('channel-id').value.trim();
            const plataforma = document.getElementById('plataforma').value;
            const affLink = document.getElementById('aff-link').value.trim();
            const statusRobo = document.getElementById('status-robo').value;
            const cupomCodigo = document.getElementById('cupom-codigo').value.trim();
            const descontoPorc = document.getElementById('desconto-porc').value.trim();
            const qtd = document.getElementById('qtd').value.trim();
            const freq = document.getElementById('freq').value;
            const detalheFreq = document.getElementById('detalhe-freq').value.trim();
            const cleanup = document.getElementById('cleanup').value;

            const diasSelecionados = [];
            document.querySelectorAll('input[name="dia"]:checked').forEach(el => {
                diasSelecionados.push(el.value);
            });

            const msgDiv = document.getElementById('status-msg');
            msgDiv.style.display = "block";
            msgDiv.style.backgroundColor = "#334155";
            msgDiv.style.color = "#38bdf8";
            msgDiv.innerText = `Salvando configurações e status da ${plataforma.toUpperCase()} na nuvem...`;

            const docName = `${plataforma}_settings`;

            db.collection("configuracoes").doc(docName).set({
                plataforma: plataforma,
                telegram_token: token,
                channel_id: channel,
                affiliate_link: affLink,
                status: statusRobo,          // <--- Chave de pausa/ativo direto pelo painel
                cupom: cupomCodigo,          // <--- Cupom fixo (CLIENTEVIP)
                desconto: descontoPorc,      // <--- Porcentagem de desconto (10%)
                quantidade: qtd,
                frequencia: freq,
                detalhe_frequencia: detalheFreq,
                dias_semana: diasSelecionados,
                limpeza: cleanup,
                atualizado_em: new Date()
            })
            .then(() => {
                msgDiv.style.backgroundColor = "rgba(16, 185, 129, 0.2)";
                msgDiv.style.color = "#10b981";
                msgDiv.innerText = `✅ Configurações da ${plataforma.toUpperCase()} salvas com sucesso!`;
            })
            .catch((error) => {
                msgDiv.style.backgroundColor = "rgba(239, 68, 68, 0.2)";
                msgDiv.style.color = "#ef4444";
                msgDiv.innerText = "❌ Erro ao salvar: " + error.message;
            });
        }

        function enviarTesteTelegram() {
            const token = document.getElementById('bot-token').value.trim();
            const channel = document.getElementById('channel-id').value.trim();
            const plataforma = document.getElementById('plataforma').value;
            const affLink = document.getElementById('aff-link').value.trim();
            const cupomCodigo = document.getElementById('cupom-codigo').value.trim();
            const msgDiv = document.getElementById('status-msg');

            if (!token || !channel) {
                msgDiv.style.display = "block";
                msgDiv.style.backgroundColor = "rgba(239, 68, 68, 0.2)";
                msgDiv.style.color = "#ef4444";
                msgDiv.innerText = "Preencha o Token e o ID do Canal antes de testar!";
                return;
            }

            msgDiv.style.display = "block";
            msgDiv.style.backgroundColor = "#334155";
            msgDiv.style.color = "#38bdf8";
            msgDiv.innerText = `Enviando teste com cupom para ${channel}...`;

            const textoTeste = `🔥 *OFERTA DE TESTE - ${plataforma.toUpperCase()}*\n\n✨ *Produto Exclusivo*\n💰 Valor Especial com 10% OFF\n🏷️ *Cupom:* \`${cupomCodigo}\`\n\n🔗 *Compre aqui:*\n${affLink}`;

            fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: channel,
                    text: textoTeste,
                    parse_mode: 'Markdown'
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    msgDiv.style.backgroundColor = "rgba(16, 185, 129, 0.2)";
                    msgDiv.style.color = "#10b981";
                    msgDiv.innerText = `✅ Teste enviado com sucesso para ${channel}!`;
                } else {
                    msgDiv.style.backgroundColor = "rgba(239, 68, 68, 0.2)";
                    msgDiv.style.color = "#ef4444";
                    msgDiv.innerText = "❌ Erro do Telegram: " + data.description;
                }
            })
            .catch(err => {
                msgDiv.style.backgroundColor = "rgba(239, 68, 68, 0.2)";
                msgDiv.style.color = "#ef4444";
                msgDiv.innerText = "❌ Erro de conexão: " + err.message;
            });
        }

        function sairDaConta() {
            auth.signOut().then(() => { window.location.href = "login.html"; });
        }
    </script>
</body>
</html>
