<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Avançado - Robô Shopee & Telegram</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 550px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; font-size: 1.5rem; }
        .section-title { font-size: 0.9rem; color: #94a3b8; margin: 20px 0 10px 0; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #cbd5e1; }
        input, select { width: 100%; padding: 10px 12px; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 0.95rem; }
        input:focus, select:focus { border-color: #38bdf8; outline: none; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        .days-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px; }
        .day-checkbox { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; background: #0f172a; padding: 6px 10px; border-radius: 4px; border: 1px solid #334155; cursor: pointer; }
        .day-checkbox input { width: auto; cursor: pointer; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s; margin-top: 10px; }
        .btn-save { background-color: #10b981; color: white; }
        .btn-save:hover { background-color: #059669; }
        .btn-test { background-color: #3b82f6; color: white; }
        .btn-test:hover { background-color: #2563eb; }
        .btn-logout { background-color: transparent; color: #ef4444; border: 1px solid #ef4444; margin-top: 15px; }
        .btn-logout:hover { background-color: rgba(239, 68, 68, 0.1); }
        #status-msg { text-align: center; margin-top: 15px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Painel do Robô - Ofertas Shopee</h2>
        
        <div class="section-title">🔑 Conexão Telegram & Shopee</div>
        <div class="form-group">
            <label for="bot-token">Token do Bot do Telegram</label>
            <input type="text" id="bot-token" value="8616829338:AAHHLoPRw5uvx4c01bkRI">
        </div>

        <div class="form-group">
            <label for="channel-id">ID do Canal</label>
            <input type="text" id="channel-id" value="@cristian_ofertas_bot_pro">
        </div>

        <div class="form-group">
            <label for="aff-link">Seu Link de Afiliado Shopee</label>
            <input type="text" id="aff-link" value="https://s.shopee.com.br/6VOwp1jg5L">
        </div>

        <div class="section-title">📅 Dias de Funcionamento</div>
        <div class="form-group">
            <label>Selecione os dias em que o robô deve enviar ofertas:</label>
            <div class="days-container">
                <label class="day-checkbox"><input type="checkbox" name="dia" value="Seg" checked> Seg</label>
                <label class="day-checkbox"><input type="checkbox" name="dia" value="Ter" checked> Ter</label>
                <label class="day-checkbox"><input type="checkbox" name="dia" value="Qua" checked> Qua</label>
                <label class="day-checkbox"><input type="checkbox" name="dia" value="Qui" checked> Qui</label>
                <label class="day-checkbox"><input type="checkbox" name="dia" value="Sex" checked> Sex</label>
                <label class="day-checkbox"><input type="checkbox" name="dia" value="Sab" checked> Sáb</label>
                <label class="day-checkbox"><input type="checkbox" name="dia" value="Dom" checked> Dom</label>
            </div>
        </div>

        <div class="section-title">📦 Volume & Frequência de Postagens</div>
        <div class="row">
            <div class="form-group">
                <label for="qtd">Quantidade / Limite</label>
                <input type="text" id="qtd" value="50" placeholder="Ex: 50 ou 'Infinito'">
            </div>
            <div class="form-group">
                <label for="freq">Base de Frequência</label>
                <select id="freq" onchange="atualizarOpcoesFrequencia()">
                    <option value="Por Hora">Por Hora (Intervalo)</option>
                    <option value="Por Dia">Por Dia (Volume Diário)</option>
                    <option value="Por Mes">Por Mês (Distribuição Mensal)</option>
                </select>
            </div>
        </div>

        <div class="form-group" id="grupo-detalhe-freq">
            <label id="label-detalhe-freq" for="detalhe-freq">Intervalo (De quantas em quantas horas?)</label>
            <input type="text" id="detalhe-freq" value="1 hora" placeholder="Ex: A cada 1 hora">
        </div>

        <div class="section-title">🧹 Limpeza Automática do Canal</div>
        <div class="form-group">
            <label for="cleanup">Apagar mensagens antigas a cada:</label>
            <select id="cleanup">
                <option value="A cada 7 Dias (Semanal)">A cada 7 Dias (Semanal)</option>
                <option value="A cada 15 Dias">A cada 15 Dias</option>
                <option value="A cada 30 Dias (Mensal)">A cada 30 Dias (Mensal)</option>
                <option value="Nunca">Nunca</option>
            </select>
        </div>

        <!-- Botões de Ação -->
        <button class="btn btn-save" onclick="salvarConfiguracoes()">💾 Salvar na Nuvem</button>
        <button class="btn btn-test" onclick="enviarTesteTelegram()">🚀 Testar Envio Imediato</button>
        <button class="btn btn-logout" onclick="sairDaConta()">Sair da Conta</button>

        <div id="status-msg"></div>
    </div>

    <script>
        // Configuração Firebase
        const firebaseConfig = {
            // Suas credenciais do Firebase
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        function atualizarOpcoesFrequencia() {
            const freq = document.getElementById('freq').value;
            const label = document.getElementById('label-detalhe-freq');
            const input = document.getElementById('detalhe-freq');

            if (freq === 'Por Hora') {
                label.innerText = "Intervalo (Ex: A cada 1 hora, a cada 2 horas)";
                input.value = "1 hora";
            } else if (freq === 'Por Dia') {
                label.innerText = "Volume ou Intervalo Diário (Ex: 10 por dia)";
                input.value = "10 por dia";
            } else if (freq === 'Por Mes') {
                label.innerText = "Meta Mensal (Ex: 50 produtos no mês)";
                input.value = "50 produtos";
            }
        }

        function salvarConfiguracoes() {
            const token = document.getElementById('bot-token').value.trim();
            const channel = document.getElementById('channel-id').value.trim();
            const affLink = document.getElementById('aff-link').value.trim();
            const qtd = document.getElementById('qtd').value.trim();
            const freq = document.getElementById('freq').value;
            const detalheFreq = document.getElementById('detalhe-freq').value.trim();
            const cleanup = document.getElementById('cleanup').value;

            const diasSelecionados = [];
            document.querySelectorAll('input[name="dia"]:checked').forEach(el => {
                diasSelecionados.push(el.value);
            });

            const msgDiv = document.getElementById('status-msg');

            db.collection("configuracoes").doc("bot_settings").set({
                telegram_token: token,
                channel_id: channel,
                affiliate_link: affLink,
                quantidade: qtd,
                frequencia: freq,
                detalhe_frequencia: detalheFreq,
                dias_semana: diasSelecionados,
                limpeza: cleanup,
                atualizado_em: new Date()
            })
            .then(() => {
                msgDiv.style.color = "#10b981";
                msgDiv.innerText = "Configurações e regras salvas com sucesso na nuvem!";
            })
            .catch((error) => {
                msgDiv.style.color = "#ef4444";
                msgDiv.innerText = "Erro ao salvar: " + error.message;
            });
        }

        function enviarTesteTelegram() {
            const token = document.getElementById('bot-token').value.trim();
            const channel = document.getElementById('channel-id').value.trim();
            const affLink = document.getElementById('aff-link').value.trim();
            const msgDiv = document.getElementById('status-msg');

            if (!token || !channel) {
                msgDiv.style.color = "#ef4444";
                msgDiv.innerText = "Preencha o Token e o ID do Canal antes de testar!";
                return;
            }

            msgDiv.style.color = "#38bdf8";
            msgDiv.innerText = "A enviar oferta de teste...";

            const textoTeste = "🔥 *ACHADO EXCLUSIVO - 50% OFF!*\n\n" +
                               "📱 *Smartphone Super Econômico*\n" +
                               "💰 De R$ 1.200,00 por apenas *R$ 599,00*\n\n" +
                               "🔗 *Compre com desconto aqui:*\n" + (affLink || "https://s.shopee.com.br/6VOwp1jg5L") + "\n\n" +
                               "⚡ _Oferta verificada e com preço imperdível!_";
            
            const url = `https://api.telegram.org/bot${token}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: channel,
                    text: textoTeste,
                    parse_mode: 'Markdown'
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    msgDiv.style.color = "#10b981";
                    msgDiv.innerText = "✅ Oferta de teste enviada com sucesso para o Telegram!";
                } else {
                    msgDiv.style.color = "#ef4444";
                    msgDiv.innerText = "❌ Erro do Telegram: " + data.description;
                }
            })
            .catch(error => {
                msgDiv.style.color = "#ef4444";
                msgDiv.innerText = "❌ Erro de rede: " + error.message;
            });
        }

        function sairDaConta() {
            auth.signOut().then(() => {
                window.location.href = "login.html";
            });
        }
    </script>
</body>
</html>
