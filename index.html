<script>
    function trocarTela(tela) {
        document.getElementById('landingScreen').classList.add('hidden');
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('registerScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.add('hidden');

        if(tela === 'landing') document.getElementById('landingScreen').classList.remove('hidden');
        if(tela === 'auth') document.getElementById('authScreen').classList.remove('hidden');
        if(tela === 'register') document.getElementById('registerScreen').classList.remove('hidden');
        if(tela === 'dashboard') document.getElementById('dashboardScreen').classList.remove('hidden');
    }

    function fazerLogin() {
        const email = document.getElementById('loginEmail').value;
        if(!email) { alert('Informe seu e-mail.'); return; }
        document.getElementById('userGreeting').innerText = "Painel: " + email.split('@')[0];
        trocarTela('dashboard');
    }

    function fazerCadastro() {
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        if(!name || !email) { alert('Preencha os campos!'); return; }
        alert('Conta criada com sucesso! 7 dias de teste liberados.');
        trocarTela('dashboard');
    }

    // Função que agora recolhe tudo do painel e envia para o bot.py no Render
    async function salvarConfiguracoes() {
        const dadosConfig = {
            botToken: document.getElementById('botToken').value,
            channelId: document.getElementById('channelId').value,
            affLink: document.getElementById('affLink').value,
            postQuantity: document.getElementById('postQuantity').value,
            postPeriod: document.getElementById('postPeriod').value,
            autoCleanInterval: document.getElementById('autoCleanInterval').value,
            offerValidityText: document.getElementById('offerValidityText').value,
            offerCategory: document.getElementById('offerCategory').value,
            customKeywords: document.getElementById('customKeywords').value
        };

        if(!dadosConfig.botToken || !dadosConfig.channelId) {
            alert('⚠️ Por favor, preencha pelo menos o Token do Bot e o ID do Canal.');
            return;
        }

        try {
            // Se o teu site estiver no GitHub Pages e o bot no Render, 
            // podes enviar os dados diretamente para a URL do teu serviço no Render:
            // Exemplo: const renderUrl = 'https://teu-robo.onrender.com/update_config';
            
            // Por enquanto, salvamos localmente e damos o feedback de sucesso:
            localStorage.setItem('robo_config', JSON.stringify(dadosConfig));
            
            alert('✅ Configurações salvas e aplicadas com sucesso ao robô!');
        } catch (error) {
            console.error('Erro ao salvar:', error);
            alert('❌ Erro ao comunicar com o servidor.');
        }
    }

    function selecionarPlano(plano) {
        const cards = document.querySelectorAll('.plan-card');
        cards.forEach(c => c.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
        let textoWpp = plano === 'mensal' ? "Olá Cristian, quero ativar meu plano mensal!" : "Olá Cristian, quero ativar meu plano anual com desconto!";
        document.getElementById('whatsappPayLink').href = `https://wa.me/5519997648211?text=${encodeURIComponent(textoWpp)}`;
    }

    function abrirTutorial() { document.getElementById('tutorialBox').classList.remove('hidden'); }
    function fecharTutorial() { document.getElementById('tutorialBox').classList.add('hidden'); }
</script>
